# W&B sweep config for baseline training. Non-swept defaults come from baseline/train_config.yaml.
# Create sweep: wandb sweep baseline/sweep.yaml
# Run agent:   wandb agent <entity>/<project>/<sweep_id>

program: scripts_all/run_sweep.py
method: random
metric:
  name: eval/success_rate_avg
  goal: maximize
# For MT-1 runs, switch metric to eval/success_rate
# metric:
#   name: eval/success_rate
#   goal: maximize

parameters:
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  epochs:
    values: [100, 250, 500, 750]
  batch_size:
    values: [32, 64, 128]
  end_weight:
    values: [1.0, 2.0, 3.0, 5.0]
  end_fraction:
    values: [0.2, 0.3, 0.4]
  suite:
    value: mt10
