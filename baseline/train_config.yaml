# Single source of truth for training hyperparameters.
# Override via CLI (train.py) or W&B sweep (scripts_all/run_sweep.py).

# Optimization
lr: 0.0003
epochs: 500
batch_size: 64
hidden_sizes: [64, 64]

# Model save
save_name: latest_policy.pth

# Loss / behavior
clip_actions: true
end_weight: 1.0
end_fraction: 0
end_inner_weight: null  # set to float (e.g. 5.0) for inner tier
end_inner_fraction: 0.05
end_upsample: false

# Run logging (local)
save_run: true
keep_runs: 50

# Eval
eval_seed: 42

# LR schedule
lr_decay_epoch: 250
lr_decay_gamma: 0.5

# Multi-task: mt1 (single task), mt10, or mt50
suite: mt1

# Device: auto, cuda, xpu, cpu
device: auto

# W&B (only used when baseline/scripts/train.py is run with use_wandb=True)
use_wandb: true
wandb_project: CS229_FinalProject
wandb_save_model: false
